# File: alembic.ini
[alembic]
# Chỉ định thư mục chứa các file migration
script_location = alembic

# Thêm thư mục hiện tại vào sys.path để Python nhận diện được module 'app'
prepend_sys_path = .

# Cấu hình timezone (tùy chọn)
timezone = UTC

# ==================================
# CẤU HÌNH LOGGING (Bắt buộc phải có để Alembic chạy)
# ==================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S